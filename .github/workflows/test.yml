name: Release Chrome Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # 去掉 tag 前面的 'v'，例如 v1.2.3 -> 1.2.3
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Package Extension
        run: |
          # 打包当前目录所有文件为 zip，排除不必要的隐藏文件和 git/github 配置文件
          zip -r tab-group-manager-v${{ steps.version.outputs.VERSION }}.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*__MACOSX*" \
            -x "*.DS_Store"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          # 如果你想自动生成 Release Notes，可以保留下面这行，否则可以删除
          generate_release_notes: true
          files: |
            tab-group-manager-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
